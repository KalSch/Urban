const c=document.querySelector('canvas'),g=c.getContext('2d'),keys={},p={x:480,y:490},loc=document.querySelector('#loc');let zoom=1.25,W,H;function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio}onresize=resize;resize();onkeydown=e=>{keys[({ArrowUp:'w',ArrowDown:'s',ArrowLeft:'a',ArrowRight:'d'})[e.key]||e.key.toLowerCase()]=true};onkeyup=e=>{keys[({ArrowUp:'w',ArrowDown:'s',ArrowLeft:'a',ArrowRight:'d'})[e.key]||e.key.toLowerCase()]=false};onblur=()=>Object.keys(keys).forEach(k=>keys[k]=false);document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys[b.dataset.k]=true};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys[b.dataset.k]=false});let seed=17;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const flecks=Array.from({length:12000},()=>[rand()*1200,rand()*850,rand()*3+1,rand()]);const buildings=[];for(let y of [100,220,420,610])for(let x of [100,290,690,900])buildings.push({x:x+rand()*20,y:y+rand()*12,w:95+rand()*35,d:65+rand()*20,h:55+rand()*45,roof:['#786d53','#526d68','#8d6248'][Math.floor(rand()*3)]});function elev(x,y){return y<340?64:y>400?0:64*(400-y)/60}function allowed(x,y){if(x<45||x>1050||y<50||y>780)return false;if(y>330&&y<410&&(x<430||x>570))return false;return !buildings.some(b=>x>b.x-5&&x<b.x+b.w+5&&y>b.y-5&&y<b.y+b.d+5)}function poly(a,fill,stroke='#493e30',lw=1.3){g.beginPath();a.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}function rect(x,y,w,h,f){g.fillStyle=f;g.fillRect(x,y,w,h);g.strokeStyle='#51483a';g.lineWidth=1;g.strokeRect(x,y,w,h)}function line(a,col,w){g.beginPath();a.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.strokeStyle=col;g.lineWidth=w;g.stroke()}function building(b){let {x,y,w,d,h,roof}=b;y-=elev(x,y);poly([[x,y+d],[x+w,y+d],[x+w,y+d-h],[x,y+d-h]],'#b6a17e');poly([[x+w,y],[x+w,y+d],[x+w,y+d-h],[x+ let last=0;function frame(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;let dx=(+!!keys.d)-(+!!keys.a),dy=(+!!keys.s)-(+!!keys.w);let n=Math.hypot(dx,dy)||1;dx*=85*dt/n;dy*=85*dt/n;if(allowed(p.x+dx,p.y))p.x+=dx;if(allowed(p.x,p.y+dy))p.y+=dy;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);g.fillStyle='#a6aa86';g.fillRect(0,0,W,H);g.translate(W/2-p.x*zoom,H*.53-(p.y-elev(p.x,p.y))*zoom);g.scale(zoom,zoom);rect(0,0,1200,850,'#a7ac86');rect(0,0,1200,340-64,'#b7b598');for(let [x,y,r,a] of flecks){g.fillStyle=a>.5?'#635d3820':'#eee1bb55';g.fillRect(x,y,r,r*.6)}poly([[0,276],[430,276],[430,400],[0,400]],'#8c8068');poly([[570,276],[1200,276],[1200,400],[570,400]],'#8c8068');for(let y=290;y<400;y+=14){line([[0,y],[430,y]],'#5c5445',1);line([[570,y],[1200,y]],'#5c5445',1)}poly([[430,276],[570,276],[570,400],[430,400]],'#b9ad8c');for(let y=280;y<400;y+=10)line([[435,y],[565,y]],'#8e8068',.7);for(let y of [175,505,735]){let yy=y-elev(500,y);rect(30,yy-23,1030,46,'#c6b89a');line([[30,yy],[1060,yy]],'#a29275',1)}rect(430,0,140,276,'#c6b89a');rect(430,400,140,450,'#c6b89a');line([[1120,0],[1100,190],[1140,276],[1110,400],[1150,850]],'#476e79',55);line([[1120,0],[1100,190],[1140,276],[1110,400],[1150,850]],'#8eb6b9',40);for(let i=0;i<7;i++)line([[1125+i*4,280],[1098+i*4,398]],'#e4e9db',2);let objs=buildings.map(b=>({y:b.y+b.d,draw:()=>building(b)}));for(let i=0;i<9;i++){let x=70+((i*139+t*.018)%960),y=i%2?505:175;objs.push({y,draw:()=>person(x,y,i%3?40:24,'#79634d')})}objs.push({y:p.y,draw:()=>{person(p.x,p.y,12,'#284e69');g.strokeStyle='#f6e8b6';g.lineWidth=1.5;g.beginPath();g.ellipse(p.x,p.y-elev(p.x,p.y),9,4,0,0,7);g.stroke()}});objs.sort((a,b)=>a.y-b.y).forEach(o=>o.draw());loc.textContent=(p.y<340?'Upper terrace':p.y>400?'Lower district':'Terrace ramp')+' · elevation '+Math.round(elev(p.x,p.y)/2)+' ft';requestAnimationFrame(frame)}requestAnimationFrame(frame);
