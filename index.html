<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Urban Might Laboratory v0.2.3.3</title><style>body{background:#17251f;color:#eee4cd;font:17px system-ui;margin:0;padding:18px;max-width:850px;margin:auto}section{background:#23372e;border:1px solid #526b5c;border-radius:14px;padding:18px;margin:14px 0}label{display:block;margin:12px 0}input,select,button{font:inherit;max-width:100%;box-sizing:border-box}input[type=range]{width:100%}input[type=number]{width:110px}button,select,input[type=number]{background:#e8d9b5;color:#17251f;border:0;border-radius:8px;padding:10px;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}small{color:#c6cbbd}button{cursor:pointer}h1{font-size:25px}</style></head><body><h1>Manufacturing Laboratory</h1><small>Urban Might · v0.2.3.3 · provisional simulation</small><section><label>Experiment <select id="scenario"></select></label><div id="parts"></div><label>Proficiency <span id="sv">80</span><input id="skill" type="range" min="0" max="100" value="80" oninput="sv.textContent=this.value"></label><label>Processing loss <span id="lv">3</span>%<input id="loss" type="range" min="0" max="30" value="3" oninput="lv.textContent=this.value"></label><label><input id="selective" type="checkbox"> Selective constituent loss</label><label>Process <select id="stage"><option value="auto">Standard / preserve defects</option><option value="remelt">Remelt / reduce defects</option></select></label><label>Base healing / poison potency <input id="base" type="number" min="0" value="50"></label><label>Diagnostic seed <input id="seed" type="number" value="1"></label><button onclick="experiment()">Run experiment</button><button onclick="reuse()">Reuse last output</button><small id="parent"></small></section><section id="result">Run an experiment.</section><section><details><summary>Simulation diagnostics</summary><pre id="diag"></pre></details></section><section><button onclick="exportReport()">Export validation report</button><button onclick="validate()">Run automated validation</button><pre id="validation"></pre></section><section><h2>Experiment history</h2><button onclick="historyRows=[];save();showHistory()">Clear history</button><div id="history"></div></section><script>const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const mean=(xs,ws)=>{let n=0,d=0;xs.forEach((x,i)=>{if(x!==null&&ws[i]>0){n+=x*ws[i];d+=ws[i]}});return d?n/d:null};
const cases=[
['Bronze', [['Copper',90,8.96],['Tin',10,7.31]], [90,90,95,85,null,null],1.2,.8],
['Carbon steel',[['Iron',99,7.87],['Carbon',1,2.2]],[90,90,90,90,null,null],1.5,.65],
['Chromium steel',[['Iron',87,7.87],['Carbon',1,2.2],['Chromium',12,7.19]],[90,85,85,90,null,null],1.4,.8],
['Oak laminate',[['Oak',90,.75],['Adhesive',10,1.1]],[85,90,90,85,null,null],1.3,.9],
['Mixed wood laminate',[['Oak',45,.75],['Pine',45,.5],['Adhesive',10,1.1]],[85,90,80,80,null,null],1.2,1.1],
['Cotton wool blend',[['Cotton',60,1.54],['Wool',40,1.31]],[90,90,85,85,90,null],1.1,1.3],
['Concrete',[['Cement',15,3.15],['Sand',30,2.65],['Aggregate',45,2.7],['Water',10,1]],[90,90,85,90,null,null],1.4,.5],
['Iron and wood — melting',[['Iron',50,7.87],['Wood',50,.7]],[85,0,80,80,null,null],1,1],
['Iron and wood — bonding',[['Iron',45,7.87],['Wood',45,.7],['Adhesive',10,1.1]],[80,90,75,70,null,null],1.2,.8],
['Spider silk textile',[['Cotton',80,1.54],['Spider silk',20,1.3]],[85,85,85,90,85,null],1.6,1.2],
['Phoenix healing mixture',[['Carrier',90,1],['Phoenix tears',10,1]],[90,85,90,null,90,85],1,1,1.4],
['Basilisk healing mixture',[['Healing mixture',95,1],['Basilisk venom',5,1]],[90,85,90,null,90,85],1,1,1.5],
['Impure bronze',[['Copper',88.2,8.96],['Tin',9.5,7.31],['Silica impurity',2.3,2.65]],[80,85,65,75,null,null],1.1,.8],
['Experimental weak composite',[['Wood',50,.7],['Mineral',50,2.6]],[35,75,45,30,null,null],.8,.9],
['Unknown interaction',[['Oak',50,.75],['Quartz',50,2.65]],[null,null,null,null,null,null],1,1]
];

const weights=[15,25,30,30,20,20];
cases.push(['Basilisk metal treatment',[['Bronze',95,8.76],['Basilisk venom',5,1]],[85,80,85,80,85,85],1.1,1.2],['Basilisk poison mixture',[['Poison mixture',95,1],['Basilisk venom',5,1]],[85,85,90,null,90,85],1,1]);
function run(c,skill=80,loss=3,amounts=c[1].map(p=>p[1]),selective=false,method='auto',parent=null,base=50,seed=1){
 const [name,parts,s,str,flex]=c; const input=amounts.reduce((a,b)=>a+b,0);if(!(input>0)||amounts.some(x=>!Number.isFinite(x)||x<0)||!Number.isFinite(base)||base<0)throw Error('Invalid mass or base property');
 const active=parts.map((p,i)=>({id:p[0],density:p[2],mass:amounts[i],i})).filter(p=>p.mass>0);const ref=parts.reduce((a,p)=>a+p[1],0);const changed=parts.reduce((a,p,i)=>a+Math.abs(amounts[i]/input-p[1]/ref),0)/2;
 const scores=s.map((v,i)=>v===null?null:clamp(v-changed*[30,0,40,35,20,20][i],0,100));const compatibility=mean(scores,weights);const critical=scores[1]===0&&active.some(p=>p.id==='Wood')&&active.some(p=>p.id==='Iron');const unknown=compatibility===null;const execution=.5+.5*skill/100;
 const roll=((Math.imul(seed|0,1664525)+1013904223)>>>0)/4294967296;const stage=unknown?'before':critical?(roll<skill/100*.6?'before':roll<.7?'early':'late'):null;
 const ledger=active.map(p=>{let l=clamp(loss/100*(selective?(p.id.includes('impurity')?2.5:p.i===0?.6:1.4):1));let product=stage?0:p.mass*(1-l);let transformed=critical&&stage!=='before'&&p.id==='Wood'?p.mass*(stage==='early'?.25:1):0;return {id:p.id,input:p.mass,product,recovered:stage?p.mass-transformed:0,waste:stage?0:p.mass-product,byproduct:transformed,byproductName:transformed?'Thermally degraded wood products':null,density:p.density}});
 const product=ledger.reduce((a,p)=>a+p.product,0),volume=product?ledger.reduce((a,p)=>a+p.product/p.density,0):null,density=product?product/volume:null,bond=compatibility===null?0:compatibility/100;
 const venom=ledger.find(p=>p.id==='Basilisk venom'), concentration=product?(venom?.product||0)/product:0, host=1-concentration;const amp=10*concentration*host*bond;const medical=name.includes('healing'),poison=name.includes('poison'),metal=name.includes('metal treatment');
 const defects=product?clamp((parent?.defects||0)*(method==='remelt'?.2:1)+(1-execution)*.25):null;
 const raw={strength:medical||poison?null:100*str*bond*execution**1.4*(1-.6*changed),flexibility:medical||poison?null:100*flex*execution**.35*(1-.3*changed),healing:medical?base*host*execution**.7:null,poison:poison?base*host*execution**.7:null};
 if(name.includes('Phoenix'))raw.healing=base*(ledger.find(p=>p.id==='Phoenix tears')?.product||0)/Math.max(product,1e-12)*10*execution**.7;
 if(parent&&method!=='remelt')for(const k of Object.keys(raw))if(raw[k]!==null&&parent.raw?.[k]!=null)raw[k]=parent.raw[k]*execution**.2;
 const props={...raw};for(const k of ['healing','poison','flexibility'])if(props[k]!==null&&(k!=='flexibility'||metal))props[k]*=1+amp;
 if(!product)for(const k of Object.keys(props))props[k]=null;
 const stability=product?100*clamp(bond*.65+execution*.35-defects*.5-concentration**2):null;
 const outcome=stage?(ledger.some(p=>p.byproduct)?'Destructive':'Unsuccessful'):stability<40?'Unstable':bond*execution<.7?'Partially successful':'Successful';const key=medical?'healing':poison?'poison':metal?'flexibility':'strength';const target=medical||poison?base:100;
 return {name,input,product,volume,density,compatibility,scores,critical,execution,...props,raw,defects,stability,concentration,amplification:amp,outcome,ledger,genealogy:{parent:parent?.id||null,inputs:active.map(p=>p.id)},compositionDeviation:changed,objective:props[key]===null?'Not evaluated':key+' target '+(props[key]>=target?'met':'not met'),key,stage,seed,method,base,skill,loss,selective};
}
function tests(){let a=[];const check=(test,pass)=>a.push({test,pass:!!pass}),near=(a,b)=>Math.abs(a-b)<1e-8;let rs=cases.map(c=>run(c));check('Mass conservation',rs.every(r=>r.ledger.every(p=>near(p.input,p.product+p.recovered+p.waste+p.byproduct))));check('Null distinct from zero',mean([null,0,100],[1,1,1])===50);check('Critical failure',rs[7].product===0);check('Automatic destructive failure',run(cases[7],0,3,undefined,false,'auto',null,50,2000).ledger.some(p=>p.byproduct));check('Alternative bonding',rs[8].product>0);let f=(b,v)=>run(cases[11],100,0,[100-v,v],false,'auto',null,b);check('Actual base scaling',near(f(20,5).healing*2,f(40,5).healing));check('Zero remains zero',f(0,5).healing===0);check('No venom baseline',near(f(50,0).healing,50));check('No host no healing',f(50,100).healing===0);check('No universal 180 cap',f(500,10).healing>180);check('Independent stability',rs[11].stability!==rs[11].compatibility);check('Medical null structural properties',rs[11].strength===null);check('Metal amplification',rs[15].flexibility>rs[15].raw.flexibility);check('Poison amplification',rs[16].poison>rs[16].raw.poison);let r=f(50,5);r.id='test';let n=run(cases[11],100,0,[95,5],false,'auto',r,50);check('No repeat amplification',near(n.healing,r.healing));check('Parent retained',n.genealogy.parent==='test');check('Impurity retained',rs[12].ledger[2].product>0);check('Unknown not fabricated',rs[14].product===0);return a}
if(typeof module!=='undefined')module.exports={run,cases,tests};
let historyRows=[];try{historyRows=JSON.parse(localStorage.getItem('um233')||'[]')}catch(e){}let last=null,parentId=null;const el=id=>document.getElementById(id);const fmt=x=>x===null?'Not measured':Number(x.toFixed(4));function save(){try{localStorage.setItem('um233',JSON.stringify(historyRows))}catch(e){el('parent').textContent='Storage unavailable; history is session-only'}}
cases.forEach((c,i)=>el('scenario').add(new Option(c[0],i)));function setup(){parentId=null;el('parent').textContent='Fresh inputs';el('parts').innerHTML=cases[+el('scenario').value][1].map((p,i)=>`<label>${p[0]} (kg) <input type="number" min="0" step="any" id="m${i}" value="${p[1]}"></label>`).join('')}el('scenario').onchange=setup;setup();function experiment(){try{let i=+el('scenario').value,c=cases[i];let r=run(c,+el('skill').value,+el('loss').value,c[1].map((p,j)=>+el('m'+j).value),el('selective').checked,el('stage').value,historyRows.find(x=>x.id===parentId)||null,+el('base').value,+el('seed').value);r.id=Date.now()+'-'+historyRows.length;r.scenario=i;last=r;historyRows.unshift(r);save();display(r);showHistory()}catch(e){el('result').textContent=e.message}}function display(r){el('result').innerHTML=`<h2>${r.name}</h2><strong>${r.outcome}</strong><p>Material produced: ${fmt(r.product)} kg</p>${['strength','flexibility','healing','poison','stability'].filter(k=>r[k]!=null).map(k=>`<p>${k}: ${k==='stability'?(r[k]>=70?'Stable':'Reduced stability'):r[k]>(r.raw[k]||100)*1.05?'Enhanced':r[k]< (r.raw[k]||100)*.95?'Reduced':'Comparable'}</p>`).join('')}<p>${r.objective}</p>`;el('diag').textContent=JSON.stringify(r,(k,v)=>typeof v==='number'?fmt(v):v,2)}function reuse(){if(!last||!last.product){el('parent').textContent='No usable output';return}el('scenario').value=last.scenario;setup();cases[last.scenario][1].forEach((p,i)=>el('m'+i).value=last.ledger.find(x=>x.id===p[0])?.product||0);el('base').value=last.base;parentId=last.id;el('parent').textContent='Parent batch: '+parentId}function showHistory(){el('history').innerHTML='';historyRows.forEach(r=>{let b=document.createElement('button');b.textContent=r.name+' · '+fmt(r.product)+' kg · '+r.outcome;b.onclick=()=>{last=r;display(r)};el('history').append(b)})}function validate(){let t=tests();el('validation').textContent=t.filter(x=>x.pass).length+'/'+t.length+' passed\n'+t.map(x=>(x.pass?'PASS ':'FAIL ')+x.test).join('\n')}showHistory();function exportReport(){const blob=new Blob([JSON.stringify({version:'0.2.3.3',experiments:historyRows,validation:tests()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='urban-might-validation-233.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}</script></body></html>
