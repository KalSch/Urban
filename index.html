<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Urban Might Laboratory v0.2.3.2</title><style>body{background:#17251f;color:#eee4cd;font:17px system-ui;margin:0;padding:18px;max-width:850px;margin:auto}section{background:#23372e;border:1px solid #526b5c;border-radius:14px;padding:18px;margin:14px 0}label{display:block;margin:12px 0}input,select,button{font:inherit;max-width:100%;box-sizing:border-box}input[type=range]{width:100%}input[type=number]{width:110px}button,select,input[type=number]{background:#e8d9b5;color:#17251f;border:0;border-radius:8px;padding:10px;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}small{color:#c6cbbd}button{cursor:pointer}h1{font-size:25px}</style></head><body><h1>Manufacturing Laboratory</h1><small>Urban Might · v0.2.3.2 · provisional simulation</small><section><label>Experiment <select id="scenario"></select></label><div id="parts"></div><label>Proficiency <span id="sv">80</span><input id="skill" type="range" min="0" max="100" value="80" oninput="sv.textContent=this.value"></label><label>Processing loss <span id="lv">3</span>%<input id="loss" type="range" min="0" max="30" value="3" oninput="lv.textContent=this.value"></label><label><input id="selective" type="checkbox"> Selective constituent loss</label><label>Failure exposure <select id="stage"><option>before</option><option>early</option><option selected>during</option><option>late</option></select></label><button onclick="experiment()">Run experiment</button><button onclick="reuse()">Reuse last output</button><small id="parent"></small></section><section id="result">Run an experiment.</section><section><details><summary>Simulation diagnostics</summary><pre id="diag"></pre></details></section><section><button onclick="validate()">Run automated validation</button><pre id="validation"></pre></section><section><h2>Experiment history</h2><button onclick="historyRows=[];save();showHistory()">Clear history</button><div id="history"></div></section><script>const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const mean=(xs,ws)=>{let n=0,d=0;xs.forEach((x,i)=>{if(x!==null&&ws[i]>0){n+=x*ws[i];d+=ws[i]}});return d?n/d:null};
const cases=[
['Bronze', [['Copper',90,8.96],['Tin',10,7.31]], [90,90,95,85,null,null],1.2,.8],
['Carbon steel',[['Iron',99,7.87],['Carbon',1,2.2]],[90,90,90,90,null,null],1.5,.65],
['Chromium steel',[['Iron',87,7.87],['Carbon',1,2.2],['Chromium',12,7.19]],[90,85,85,90,null,null],1.4,.8],
['Oak laminate',[['Oak',90,.75],['Adhesive',10,1.1]],[85,90,90,85,null,null],1.3,.9],
['Mixed wood laminate',[['Oak',45,.75],['Pine',45,.5],['Adhesive',10,1.1]],[85,90,80,80,null,null],1.2,1.1],
['Cotton wool blend',[['Cotton',60,1.54],['Wool',40,1.31]],[90,90,85,85,90,null],1.1,1.3],
['Concrete',[['Cement',15,3.15],['Sand',30,2.65],['Aggregate',45,2.7],['Water',10,1]],[90,90,85,90,null,null],1.4,.5],
['Iron and wood — melting',[['Iron',50,7.87],['Wood',50,.7]],[85,0,80,80,null,null],1,1],
['Iron and wood — bonding',[['Iron',45,7.87],['Wood',45,.7],['Adhesive',10,1.1]],[80,90,75,70,null,null],1.2,.8],
['Spider silk textile',[['Cotton',80,1.54],['Spider silk',20,1.3]],[85,85,85,90,85,null],1.6,1.2],
['Phoenix healing mixture',[['Carrier',90,1],['Phoenix tears',10,1]],[90,85,90,null,90,85],1,1,1.4],
['Basilisk healing mixture',[['Healing mixture',95,1],['Basilisk venom',5,1]],[90,85,90,null,90,85],1,1,1.5],
['Impure bronze',[['Copper',88.2,8.96],['Tin',9.5,7.31],['Silica impurity',2.3,2.65]],[80,85,65,75,null,null],1.1,.8],
['Experimental weak composite',[['Wood',50,.7],['Mineral',50,2.6]],[35,75,45,30,null,null],.8,.9],
['Unknown interaction',[['Oak',50,.75],['Quartz',50,2.65]],[null,null,null,null,null,null],1,1]
];

const weights=[15,25,30,30,20,20];
function run(c,skill=80,loss=3,amounts=c[1].map(p=>p[1]),selective=false,stage='during',parent=null){
 const [name,parts,s,str,flex,heal]=c; const input=amounts.reduce((a,b)=>a+b,0); if(!(input>0)||amounts.some(x=>!Number.isFinite(x)||x<0))throw Error('Enter positive total mass and nonnegative quantities');
 const active=parts.map((p,i)=>({...{id:p[0],density:p[2],mass:amounts[i]},i})).filter(p=>p.mass>0); const changed=active.reduce((a,p)=>a+Math.abs(p.mass/input-parts[p.i][1]/parts.reduce((a,b)=>a+b[1],0)),0)/2;
 const scores=s.map((v,i)=>v===null?null:clamp(v-changed*[30,0,40,35,20,20][i],0,100)); const compatibility=mean(scores,weights); const critical=scores[1]===0&&active.some(p=>p.id==='Wood')&&active.some(p=>p.id==='Iron'); const unknown=compatibility===null||active.length<2; const execution=.5+.5*skill/100;
 const ledger=active.map(p=>{let l=clamp(loss/100*(selective?(p.id.includes('impurity')?2.5: p.i===0?.6:1.4):1));let product=critical||unknown?0:p.mass*(1-l);let transformed=critical&&stage!=='before'&&p.id==='Wood'?p.mass*(stage==='early'?.25:stage==='during'?.8:1):0;let recovered=critical||unknown?p.mass-transformed:0;return {id:p.id,input:p.mass,product,recovered,waste:critical||unknown?0:p.mass-product,byproduct:transformed,density:p.density}});
 const product=ledger.reduce((a,p)=>a+p.product,0);const volume=product?ledger.reduce((a,p)=>a+p.product/p.density,0):null;const density=product?product/volume:null;const bond=compatibility===null?null:compatibility/100;const stability=product?100*bond*(.75+.25*execution):null;
 const strength=product?100*str*bond*execution**1.4*(1-.6*changed):null;const flexibility=product?100*flex*execution**.35*(1-.3*changed):null;
 const venom=ledger.find(p=>p.id==='Basilisk venom');const tears=ledger.find(p=>p.id==='Phoenix tears');const healing=product&&heal!==undefined?(tears?100*heal*(tears.product/product)/.1:100*(1+Math.min(.8,(venom?.product||0)/product*10)))*execution**.7:null;
 const outcome=unknown?'Unsuccessful — uncharacterized interaction':critical?(ledger.some(p=>p.byproduct>0)?'Destructive':'Unsuccessful'):stability<40?'Unstable':bond*execution<.7?'Partially successful':'Successful';
 return {name,input,product,volume,density,compatibility,scores,critical,execution,strength,flexibility,healing,stability,outcome,ledger,genealogy:{parent,inputs:active.map(p=>p.id)},compositionDeviation:changed,objective:strength===null?'Not evaluated':strength>=100?'Strength target met':'Strength target not met'};
}
function tests(){let a=[];let check=(n,v)=>a.push({test:n,pass:!!v});let near=(a,b)=>Math.abs(a-b)<1e-8;let rs=cases.map(c=>run(c));check('Mass conservation',rs.every(r=>near(r.input,r.ledger.reduce((a,p)=>a+p.product+p.recovered+p.waste+p.byproduct,0))));check('Constituent conservation',rs.every(r=>r.ledger.every(p=>near(p.input,p.product+p.recovered+p.waste+p.byproduct))));check('Null distinct from zero',mean([null,0,100],[1,1,1])===50);check('All null',mean([null],[1])===null);check('Critical failure at mastery',run(cases[7],100).product===0);check('Wood transforms during failure',rs[7].ledger.find(p=>p.id==='Wood').byproduct===40);check('Preflight recovery',run(cases[7],100,3,undefined,false,'before').ledger.every(p=>p.recovered===p.input));check('Alternative bonding',rs[8].product>0);let low=run(cases[1],11),high=run(cases[1],91);check('Independent execution responses',!near(high.strength/low.strength,high.flexibility/low.flexibility));check('Compatibility independent of skill',low.compatibility===high.compatibility);check('Selective loss changes composition',!near(run(cases[12],80,3,undefined,true).ledger[2].product,rs[12].ledger[2].product));check('Impurity retained',rs[12].ledger[2].product>0);check('Composition changes properties',run(cases[0],80,3,[80,20]).strength!==rs[0].strength);check('Weak material produced',rs[13].product>0&&rs[13].strength<100);check('Healing separate',rs[10].healing>0&&rs[0].healing===null);check('Venom concentration response',run(cases[11],80,3,[98,2]).healing<rs[11].healing);check('Unknown not fabricated',rs[14].product===0);check('Volume positive',rs.every(r=>!r.product||r.volume>0));let r=rs[12], next=run(cases[12],80,3,r.ledger.map(p=>p.product),true,'during','batch-1');check('Sequential impurity and parent',next.ledger[2].product>0&&next.genealogy.parent==='batch-1'&&near(next.input,r.product));return a}
if(typeof module!=='undefined')module.exports={run,cases,tests};

let historyRows=[];try{historyRows=JSON.parse(localStorage.getItem('um232')||'[]')}catch(e){}let last=null,parentId=null;const el=id=>document.getElementById(id);const fmt=x=>x===null?'Not measured':Number(x.toFixed(4));function save(){try{localStorage.setItem('um232',JSON.stringify(historyRows))}catch(e){el('parent').textContent='Storage unavailable; history is session-only'}}
cases.forEach((c,i)=>el('scenario').add(new Option(c[0],i)));function setup(){parentId=null;el('parent').textContent='Fresh inputs';el('parts').innerHTML=cases[+el('scenario').value][1].map((p,i)=>`<label>${p[0]} (kg) <input type="number" min="0" step="any" id="m${i}" value="${p[1]}"></label>`).join('')}el('scenario').onchange=setup;setup();function experiment(){try{let i=+el('scenario').value,c=cases[i];let r=run(c,+el('skill').value,+el('loss').value,c[1].map((p,j)=>+el('m'+j).value),el('selective').checked,el('stage').value,parentId);r.id=Date.now()+'-'+historyRows.length;r.scenario=i;last=r;historyRows.unshift(r);save();display(r);showHistory()}catch(e){el('result').textContent=e.message}}function display(r){el('result').innerHTML=`<h2>${r.name}</h2><strong>${r.outcome}</strong><p>Material produced: ${fmt(r.product)} kg</p><p>Strength: ${r.strength===null?'Not measured':r.strength>=105?'Improved':r.strength<95?'Reduced':'Comparable'}</p><p>Flexibility: ${r.flexibility===null?'Not measured':r.flexibility>=105?'Improved':r.flexibility<95?'Reduced':'Comparable'}</p><p>${r.objective}</p>`;el('diag').textContent=JSON.stringify(r,(k,v)=>typeof v==='number'?fmt(v):v,2)}function reuse(){if(!last||!last.product){el('parent').textContent='No usable output';return}el('scenario').value=last.scenario;setup();cases[last.scenario][1].forEach((p,i)=>el('m'+i).value=last.ledger.find(x=>x.id===p[0])?.product||0);parentId=last.id;el('parent').textContent='Parent batch: '+parentId}function showHistory(){el('history').innerHTML='';historyRows.forEach(r=>{let b=document.createElement('button');b.textContent=r.name+' · '+fmt(r.product)+' kg · '+r.outcome;b.onclick=()=>{last=r;display(r)};el('history').append(b)})}function validate(){let t=tests();el('validation').textContent=t.filter(x=>x.pass).length+'/'+t.length+' passed\n'+t.map(x=>(x.pass?'PASS ':'FAIL ')+x.test).join('\n')}showHistory();</script></body></html>
