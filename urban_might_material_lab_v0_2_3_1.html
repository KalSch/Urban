<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Urban Might Material Lab v0.2.3.1</title><style>body{background:#18241f;color:#f3e9d5;font:17px system-ui;margin:auto;max-width:800px;padding:20px}section{background:#24372e;border:1px solid #536b59;border-radius:12px;padding:16px;margin:12px 0}select,button,input{font:inherit;max-width:100%}select,button{padding:12px;background:#e9d9b6;color:#18241f;border:0;border-radius:6px}input[type=range]{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}small{color:#c8c7b5}h1{color:#dfbf79}label{display:block;margin:12px 0}button{margin:5px 0}</style></head><body><small>URBAN MIGHT • ENGINE VALIDATION v0.2.3.1</small><h1>Manufacturing laboratory</h1><section><label>Experiment</label><select id="scenario"></select><label>Manufacturer proficiency <output id="sv"></output><input id="skill" type="range" min="0" max="100" value="80"></label><label>Processing loss <output id="lv"></output><input id="loss" type="range" min="0" max="30" value="2"></label><button id="execute">Run experiment</button></section><section id="result">Select an experiment and run it.</section><section><details><summary>Simulation diagnostics</summary><pre id="diag"></pre></details></section><section><button id="validate">Run automated validation</button><pre id="checks"></pre></section><small>Provisional coefficients and normalized property units. Not a scientific materials database. Unknown interactions are deferred, not simulated.</small><script>const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const mean=(xs,ws)=>{let n=0,d=0;xs.forEach((x,i)=>{if(x!==null&&ws[i]>0){n+=x*ws[i];d+=ws[i]}});return d?n/d:null};
const cases=[
['Bronze', [['Copper',90,8.96],['Tin',10,7.31]], [90,90,95,85,null,null],1.2,.8],
['Carbon steel',[['Iron',99,7.87],['Carbon',1,2.2]],[90,90,90,90,null,null],1.5,.65],
['Chromium steel',[['Iron',87,7.87],['Carbon',1,2.2],['Chromium',12,7.19]],[90,85,85,90,null,null],1.4,.8],
['Oak laminate',[['Oak',90,.75],['Adhesive',10,1.1]],[85,90,90,85,null,null],1.3,.9],
['Mixed wood laminate',[['Oak',45,.75],['Pine',45,.5],['Adhesive',10,1.1]],[85,90,80,80,null,null],1.2,1.1],
['Cotton wool blend',[['Cotton',60,1.54],['Wool',40,1.31]],[90,90,85,85,90,null],1.1,1.3],
['Concrete',[['Cement',15,3.15],['Sand',30,2.65],['Aggregate',45,2.7],['Water',10,1]],[90,90,85,90,null,null],1.4,.5],
['Iron and wood — melting',[['Iron',50,7.87],['Wood',50,.7]],[85,0,80,80,null,null],1,1],
['Iron and wood — bonding',[['Iron',45,7.87],['Wood',45,.7],['Adhesive',10,1.1]],[80,90,75,70,null,null],1.2,.8],
['Spider silk textile',[['Cotton',80,1.54],['Spider silk',20,1.3]],[85,85,85,90,85,null],1.6,1.2],
['Phoenix healing mixture',[['Carrier',90,1],['Phoenix tears',10,1]],[90,85,90,null,90,85],1,1,1.4],
['Basilisk healing mixture',[['Healing mixture',95,1],['Basilisk venom',5,1]],[90,85,90,null,90,85],1,1,1.5],
['Impure bronze',[['Copper',88.2,8.96],['Tin',9.5,7.31],['Silica impurity',2.3,2.65]],[80,85,65,75,null,null],1.1,.8],
['Experimental weak composite',[['Wood',50,.7],['Mineral',50,2.6]],[35,75,45,30,null,null],.8,.9],
['Unknown interaction',[['Oak',50,.75],['Quartz',50,2.65]],[null,null,null,null,null,null],1,1]
];
function run(c,skill=80,loss=2,scale=1){const [name,parts,s,str,flex,heal]=c;const input=parts.reduce((a,p)=>a+p[1]*scale,0);const compatibility=mean(s,[15,25,30,30,20,20]);const critical=s[1]===0;const unknown=compatibility===null;const execution=.5+.5*skill/100;const bond=unknown?null:compatibility/100;const yieldFraction=critical||unknown?0:1-loss/100;const ledger=parts.map(([id,m,d])=>({id,input:m*scale,product:m*scale*yieldFraction,recovered:m*scale*(critical||unknown?1:0),waste:m*scale*(critical||unknown?0:loss/100)}));const product=ledger.reduce((a,p)=>a+p.product,0);const density=product?input/parts.reduce((a,p)=>a+p[1]*scale/p[2],0):null;const strength=product?100*str*bond*execution:null;const flexibility=product?100*flex*execution:null;const healing=product&&heal?100*heal*execution:null;const outcome=unknown?'Unsuccessful — interaction unknown':critical?'Unsuccessful':bond<.4?'Unstable':bond*execution<.7?'Partially successful':'Successful';return {name,input,product,compatibility,critical,execution,density,strength,flexibility,healing,outcome,ledger,genealogy:parts.map(p=>p[0])}}
function tests(){let out=[];const check=(n,b)=>out.push({test:n,pass:!!b});const near=(a,b)=>Math.abs(a-b)<1e-8;let rs=cases.map(c=>run(c));check('Mass conserved in every scenario',rs.every(r=>near(r.input,r.ledger.reduce((a,p)=>a+p.product+p.recovered+p.waste,0))));check('Every constituent conserved',rs.every(r=>r.ledger.every(p=>near(p.input,p.product+p.recovered+p.waste))));check('Impurity identity retained',rs[12].ledger.some(p=>p.id==='Silica impurity'&&p.product>0));check('Null excluded; zero included',mean([null,0,100],[1,1,1])===50);check('All null stays null',mean([null],[1])===null);check('Critical thermal failure',rs[7].product===0&&rs[7].compatibility>0);check('Alternative process works',rs[8].product>0);check('Proficiency changes execution',run(cases[0],20).strength<run(cases[0],95).strength);check('Proficiency cannot override critical failure',run(cases[7],100).product===0);check('Failed batch recoverable',near(rs[7].ledger.reduce((a,p)=>a+p.recovered,0),rs[7].input));check('Independent property tradeoff',run(cases[1],100).strength>100&&run(cases[1],100).flexibility<100);check('Weak material still produced',rs[13].product>0&&rs[13].strength<100);check('Fantasy healing property separate',rs[10].healing!==null&&rs[0].healing===null);check('Unknown interaction not invented',rs[14].product===0&&rs[14].compatibility===null);check('Genealogy retained',rs.every(r=>r.genealogy.length===r.ledger.length));check('Scale invariance',near(run(cases[0],80,2,2).product,2*rs[0].product));check('Density positive for products',rs.every(r=>!r.product||r.density>0));return out}
if(typeof module!=='undefined')module.exports={run,cases,tests,mean};

const $=id=>document.getElementById(id);cases.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c[0];$('scenario').append(o)});function update(){ $('sv').value=$('skill').value;$('lv').value=$('loss').value+'%'}$('skill').oninput=$('loss').oninput=update;update();$('execute').onclick=()=>{let r=run(cases[+$('scenario').value],+$('skill').value,+$('loss').value);$('result').innerHTML='<h2>'+r.name+'</h2><strong>'+r.outcome+'</strong><p>Material produced: '+r.product.toFixed(2)+' kg</p><p>Strength: '+(r.strength===null?'Not measured':r.strength>105?'Improved':r.strength<95?'Reduced':'Comparable')+'</p><p>Flexibility: '+(r.flexibility===null?'Not measured':r.flexibility>105?'Improved':r.flexibility<95?'Reduced':'Comparable')+'</p>';$('diag').textContent=JSON.stringify(r,null,2)};$('validate').onclick=()=>{let t=tests();$('checks').textContent=t.filter(x=>x.pass).length+'/'+t.length+' passed\n'+t.map(x=>(x.pass?'PASS ':'FAIL ')+x.test).join('\n')};</script></body></html>
